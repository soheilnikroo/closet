services:
  postgres:
    image: postgres:17-alpine
    container_name: closet-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: closet
      POSTGRES_PASSWORD: closet
      POSTGRES_DB: closet
    volumes:
      - closet_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U closet -d closet"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  closet_postgres_data:
